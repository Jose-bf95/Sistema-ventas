const stockLight = p => {
  if (!p.minStock || p.minStock === 0) return { color:T.grn, label:'🟢 OK' };
  const r = (p.qty || 0) / p.minStock;
  if (r <= 0)   return { color:T.red, label:'🔴 Agotado' };
  if (r <= 1)   return { color:T.red, label:'🔴 Crítico' };
  if (r <= 1.5) return { color:T.yel, label:'🟡 Bajo' };
  return { color:T.grn, label:'🟢 OK' };
};

const calcProduct = (totalCost, qty, margin) => {
  const tc=pf(totalCost), q=pf(qty), m=pf(margin);
  const unitCost      = q > 0 ? tc/q : 0;
  const priceUSD      = unitCost * (1 + m/100);
  const profitPerUnit = priceUSD - unitCost;
  const grossProfit   = profitPerUnit * q;
  return { unitCost, priceUSD, profitPerUnit, grossProfit };
};

const neg   = () => db ? db.collection('negocios').doc(NEGOCIO_ID) : null;
const col   = name => neg()?.collection(name);
const docF  = (c,id) => col(c)?.doc(id);
const cfgRef= () => neg();

const useCol = (colName, orderField='createdAt') => {
  const [data, setData] = useState([]);
  useEffect(() => {
    if (!db) return;
    const q = orderField ? col(colName).orderBy(orderField,'asc') : col(colName);
    const unsub = q.onSnapshot(
      snap => setData(snap.docs.map(d=>({id:d.id,...d.data()}))),
      err  => { console.error(colName,err); setData([]); }
    );
    return unsub;
  }, [colName]);
  return data;
};

const useConfig = () => {
  const [cfg, setCfg] = useState(null);
  useEffect(() => {
    if (!db) { setCfg(DEFAULT_CFG()); return; }
    const unsub = cfgRef().onSnapshot(snap => {
      if (snap.exists) { setCfg({...DEFAULT_CFG(),...snap.data()}); }
      else { const d=DEFAULT_CFG(); cfgRef().set(d); setCfg(d); }
    }, () => setCfg(DEFAULT_CFG()));
    return unsub;
  }, []);
  return cfg;
};

// APP ROOT
// ════════════════════════════════════════════════════════════
function App(){
  const [currentUser, setCurrentUser]     = useState(null);
  const [view,        setView]            = useState('login');
  const [activeWorker,setActiveWorker]    = useState(null);
  const [toast,       setToast]           = useState(null);
  const [isOnline,    setIsOnline]        = useState(navigator.onLine);
  const [fbOK,        setFbOK]           = useState(false);

  useEffect(() => {
    setTimeout(() => setFbOK(!!db && FIREBASE_CONFIG.apiKey !== 'TU_API_KEY'), 900);
  }, []);
  useEffect(() => {
    const on=()=>setIsOnline(true), off=()=>setIsOnline(false);
    window.addEventListener('online',on); window.addEventListener('offline',off);
    return () => { window.removeEventListener('online',on); window.removeEventListener('offline',off); };
  },[]);

  const notify = (msg, type='success') => { setToast({msg,type}); setTimeout(()=>setToast(null),4000); };
  const login  = (email,pw,users) => {
    const u = users.find(u=>u.email.toLowerCase()===email.toLowerCase()&&u.password===pw&&u.active!==false);
    if (!u) return false;
    setCurrentUser(u); setView(u.role==='admin'?'dashboard':'shiftSelect'); return true;
  };
  const logout = () => { setCurrentUser(null); setView('login'); setActiveWorker(null); };

  const sp = { currentUser, activeWorker, notify, logout, setView, isOnline, fbOK };

  if (view==='login')       return <LoginView       login={login} isOnline={isOnline} fbOK={fbOK}/>;
  if (view==='shiftSelect') return <ShiftSelectView onSelect={w=>{setActiveWorker(w);setView('dashboard');}} currentUser={currentUser}/>;

  return (
    <div style={S.page}>
      <Toast toast={toast}/>
      {!isOnline && <div style={{background:'#7c2020',color:'#ffc',fontSize:12,fontWeight:700,textAlign:'center',padding:'6px',letterSpacing:'0.03em'}}>⚡ OFFLINE — Firestore sincronizará al reconectar</div>}
      {!fbOK     && <div style={{background:'#1a0e00',color:T.yel,fontSize:11,fontWeight:700,textAlign:'center',padding:'5px'}}>⚠️ Firebase no configurado — datos solo en este dispositivo</div>}
      <NavBar view={view} setView={setView} currentUser={currentUser} activeWorker={activeWorker} logout={logout}/>
      <div style={{maxWidth:1340,margin:'0 auto',padding:'22px 14px'}}>
        {view==='dashboard'   && <DashboardView   {...sp}/>}
        {view==='inventory'   && <InventoryView   {...sp}/>}
        {view==='pos'         && <POSView         {...sp}/>}
        {view==='receivables' && <ReceivablesView {...sp}/>}
        {view==='reports'     && <ReportsView     {...sp}/>}
        {view==='settings'    && (currentUser?.role==='admin'
          ? <SettingsView {...sp}/>
          : <div style={{color:T.red,padding:40,fontSize:18}}>⛔ Acceso denegado. Solo administradores.</div>
        )}
      </div>
    </div>
  );
}

function DashboardView(){
  const cfg      = useConfig();
  const products = useCol('productos');

  const rates    = cfg?.rates    || {bcv:36.50,parallel:38.20,active:'parallel'};
  const settings = cfg?.settings || {};
  const rate     = rates.active==='bcv' ? rates.bcv : rates.parallel;

  const today      = todayStr();
  const tSales     = sales.filter(s=>s.date?.startsWith(today));
  const tRev       = tSales.reduce((a,s)=>a+pf(s.total),0);
  const tProfit    = tSales.reduce((a,s)=>a+pf(s.profit),0);
  const lowStock   = products.filter(p=>{const sl=stockLight(p);return sl.color!==T.grn;});
  const outStock   = products.filter(p=>(p.qty||0)<=0);

      </div>

        <KpiCard label="Ganancia Hoy"  value={`$${n(tProfit)}`} sub={`Bs ${n(tProfit*rate)}`} color={T.grn} icon="📈"/>
        <KpiCard label="Tasa Activa"   value={`Bs ${n(rate,2)}`} sub={rates.active==='bcv'?'🏦 BCV':'📈 Paralelo'} color={T.acc} icon="💱"/>
        <KpiCard label="Stock Crítico" value={lowStock.length}   sub={`${outStock.length} agotados · ${products.length} total`} color={lowStock.length>0?T.red:T.grn} icon="🚦"/>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(295px,1fr))',gap:16}}>
        {/* Panel de tasas */}

          <h3 style={{...S.h3,marginBottom:16}}>💱 Panel Maestro de Tasas</h3>

            <div><label style={S.lbl}>Tasa BCV</label><input style={S.inp} type="number" step="0.01" value={bcvVal} onChange={e=>setBcvVal(e.target.value)}/></div>
            <div><label style={S.lbl}>Tasa Paralelo</label><input style={S.inp} type="number" step="0.01" value={parVal} onChange={e=>setParVal(e.target.value)}/></div>
          </div>
          <div style={{display:'flex',gap:8,marginBottom:12}}>
            {[['bcv','🏦 BCV'],['parallel','📈 Paralelo']].map(([v,l])=>(
              <button key={v} onClick={()=>updCfg({rates:{...rates,bcv:pf(bcvVal),parallel:pf(parVal),active:v}})}
                style={{flex:1,padding:'8px',borderRadius:8,border:`2px solid ${rates.active===v?T.acc:T.brd}`,background:rates.active===v?T.acc+'22':'transparent',color:rates.active===v?T.acc:T.mut,cursor:'pointer',fontWeight:700,fontFamily:'inherit',fontSize:13}}>
                {l}

          </div>
          <button style={{...S.btnP,width:'100%'}} onClick={saveRates}>💾 Guardar Tasas ☁️</button>

          </div>
        </div>

        {/* Semáforo */}
        <div style={S.card}>
          <h3 style={{...S.h3,marginBottom:14}}>🚦 Semáforo de Inventario</h3>
          {lowStock.length===0
            ? <div style={{color:T.grn,padding:'18px 0',textAlign:'center',fontSize:14}}>✅ Todo el inventario está bien</div>
            : <div style={{display:'flex',flexDirection:'column',gap:7,maxHeight:280,overflowY:'auto'}}>
                {lowStock.map(p=>{const sl=stockLight(p);const unit=ALL_UNITS.find(u=>u.id===p.unit)||{abbr:'und'};return(
                  <div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 11px',background:T.bg3,borderRadius:8,borderLeft:`3px solid ${sl.color}`}}>
                    <div><div style={{fontWeight:600,fontSize:12}}>{p.name}</div><div style={{color:T.mut,fontSize:11}}>Stock: {n(p.qty,2)} {unit.abbr} | Mín: {p.minStock}</div></div>
                    <span style={S.bdg(sl.color)}>{sl.label}</span>
                  </div>
                );})}
              </div>
          }
        </div>

        {/* Top productos hoy */}
        <div style={S.card}>
          <h3 style={{...S.h3,marginBottom:14}}>🏆 Top Ventas del Día</h3>
          {tSales.length===0
            ? <div style={{color:T.mut,textAlign:'center',padding:'18px 0',fontSize:13}}>Sin ventas hoy todavía</div>
            : (() => {
                const counts = {};
                tSales.forEach(s=>(s.items||[]).forEach(i=>{ counts[i.name]=(counts[i.name]||0)+pf(i.qty); }));
                const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
                return (
                  <div style={{display:'flex',flexDirection:'column',gap:7}}>
                    {top.map(([name,qty],i)=>(
                      <div key={name} style={{display:'flex',justifyContent:'space-between',padding:'8px 11px',background:T.bg3,borderRadius:7}}>
                        <span style={{fontSize:12,fontWeight:600}}>{i+1}. {name}</span>
                        <span style={{color:T.acc,fontWeight:700,fontSize:12}}>{n(qty,1)} und</span>
                      </div>
                    ))}
                  </div>
                );
              })()
          }
        </div>
      </div>
    </div>
  );
}

function InventoryView({notify}){
  const cfg      = useConfig();
  const products = useCol('productos');
  const rates    = cfg?.rates || {bcv:36.50,parallel:38.20,active:'parallel'};
  const rate     = rates.active==='bcv' ? rates.bcv : rates.parallel;

  const [showForm, setShowForm] = useState(false);
  const [editing,  setEditing]  = useState(null);
  const [search,   setSearch]   = useState('');
  const [catF,     setCatF]     = useState('');
  const [showDemoBtn, setShowDemoBtn] = useState(true);
  const [form, setForm] = useState({name:'',category:'',unit:'und',totalCost:'',qty:'',margin:'30',minStock:'10',variants:[]});

  const cats = [...new Set(products.map(p=>p.category).filter(Boolean))];
  const filtered = products.filter(p=>{
    const ms = !search || p.name.toLowerCase().includes(search.toLowerCase()) || p.category?.toLowerCase().includes(search.toLowerCase());
    const mc = !catF || p.category===catF;
    return ms && mc;
  });
  const calc = calcProduct(form.totalCost, form.qty, form.margin);
  const ff   = (k,v) => setForm(p=>({...p,[k]:v}));

  const openNew  = () => { setForm({name:'',category:'',unit:'und',totalCost:'',qty:'',margin:'30',minStock:'10'}); setEditing(null); setShowForm(true); };
  const openEdit = p  => { setForm({name:p.name,category:p.category||'',unit:p.unit||'und',totalCost:p.totalCost,qty:p.qty,margin:p.margin,minStock:p.minStock||10}); setEditing(p.id); setShowForm(true); };

  const save = async () => {
    if(!form.name||!form.totalCost||!form.qty){notify('Complete nombre, costo y cantidad','error');return;}
    const c = calcProduct(form.totalCost,form.qty,form.margin);
    const data = { name:form.name, category:form.category, unit:form.unit||'und', totalCost:pf(form.totalCost), qty:pf(form.qty), margin:pf(form.margin), minStock:pf(form.minStock)||10, ...c, sold:0, updatedAt:new Date().toISOString() };
    if(db){
      if(editing){ await docF('productos',editing).update(data); notify('Producto actualizado ☁️'); }
      else { await col('productos').add({...data,createdAt:new Date().toISOString()}); notify('Producto agregado ☁️'); }
    } else { notify('Sin Firebase: demo','error'); }
    setShowForm(false);
  };

  const del = async id => {
    if(!confirm('¿Eliminar este producto?'))return;
    if(db) await docF('productos',id).delete();
    notify('Producto eliminado');
  };

  const loadDemoProducts = async () => {
    if(!db){notify('Necesitas Firebase configurado','error');return;}
    if(!confirm(`¿Cargar ${DEMO_PRODUCTS.length} productos de ejemplo?`))return;
    const batch = db.batch();
    DEMO_PRODUCTS.forEach(p=>{
      const c = calcProduct(p.totalCost, p.qty, p.margin);
      const ref = col('productos').doc();
      batch.set(ref,{...p,...c,updatedAt:new Date().toISOString(),createdAt:new Date().toISOString()});
    });
    await batch.commit();
    setShowDemoBtn(false);
    notify(`✅ ${DEMO_PRODUCTS.length} productos de ejemplo cargados ☁️`);
  };

  const exportSheets = async () => {
    const rows = products.map(p=>([p.name,p.category,p.unit,n(p.qty),n(p.unitCost),n(p.priceUSD),n(p.priceUSD*rate),n(p.margin)+'%',p.minStock]));
    const ok = await exportToSheets([['Producto','Categoría','Unidad','Stock','Costo Unit.$','Precio $','Precio Bs','Margen','Stock Mín'],...rows],'Inventario');
    if(ok) notify('✅ Exportado a Google Sheets');
    else {
      const csv = [['Producto','Categoría','Unidad','Stock','Costo $','Precio $','Precio Bs','Margen','Mín'],...products.map(p=>[p.name,p.category,p.unit,n(p.qty),n(p.unitCost),n(p.priceUSD),n(p.priceUSD*rate),n(p.margin)+'%',p.minStock])].map(r=>r.join(',')).join('\n');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv'}));a.download=`inventario_${todayStr()}.csv`;a.click();
      notify('📥 Exportado como CSV');
    }
  };

  const unitLabel = uid => ALL_UNITS.find(u=>u.id===uid)?.abbr || uid;

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}}>
        <h1 style={S.h1}>📦 Inventario</h1>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {showDemoBtn && products.length===0 && <button style={{...S.btnSm,color:T.yel,borderColor:T.yel+'44'}} onClick={loadDemoProducts}>📥 Cargar Ejemplos</button>}
          <button style={{...S.btnSm,color:T.cyn,borderColor:T.cyn+'44'}} onClick={exportSheets}>📤 Exportar</button>
          <button style={S.btnP} onClick={openNew}>+ Nuevo Producto</button>
        </div>
      </div>
      <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
        <input style={{...S.inp,flex:1,minWidth:180}} placeholder="🔍 Buscar producto..." value={search} onChange={e=>setSearch(e.target.value)}/>
        <select style={{...S.sel,width:'auto',minWidth:150}} value={catF} onChange={e=>setCatF(e.target.value)}>
          <option value="">Todas las categorías</option>
          {cats.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>

      <Modal show={showForm} onClose={()=>setShowForm(false)} title={editing?'✏️ Editar Producto':'📦 Nuevo Producto'} maxW={660}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
          <div style={{gridColumn:'1/-1'}}><FRow label="Nombre del Producto"><input style={S.inp} placeholder="Ej: Queso Blanco por Kilo" value={form.name} onChange={e=>ff('name',e.target.value)}/></FRow></div>
          <FRow label="Categoría">
            <input style={S.inp} placeholder="Ej: Charcutería" list="cats_list" value={form.category} onChange={e=>ff('category',e.target.value)}/>
            <datalist id="cats_list">{cats.map(c=><option key={c} value={c}/>)}</datalist>
          </FRow>
          <FRow label="Unidad de Venta">
            <select style={S.sel} value={form.unit} onChange={e=>ff('unit',e.target.value)}>
              {ALL_UNITS.map(u=><option key={u.id} value={u.id}>{u.label} ({u.abbr})</option>)}
            </select>
          </FRow>
          <FRow label="Costo Total de Compra ($)" tip="Lo que pagaste por todo">
            <input style={S.inp} type="number" step="0.01" placeholder="0.00" value={form.totalCost} onChange={e=>ff('totalCost',e.target.value)}/>
          </FRow>
          <FRow label={`Cantidad Recibida (${unitLabel(form.unit)})`}>
            <input style={S.inp} type="number" step="0.001" placeholder="0" value={form.qty} onChange={e=>ff('qty',e.target.value)}/>
          </FRow>
          <FRow label="Margen de Ganancia (%)">
            <input style={S.inp} type="number" step="0.5" value={form.margin} onChange={e=>ff('margin',e.target.value)}/>
          </FRow>
          <FRow label={`Stock Mínimo (${unitLabel(form.unit)}) — Alerta`}>
            <input style={S.inp} type="number" step="0.5" value={form.minStock} onChange={e=>ff('minStock',e.target.value)}/>
          </FRow>
        </div>
        {form.totalCost&&form.qty&&(
          <div style={{background:T.bg3,borderRadius:12,padding:14,marginBottom:14}}>
            <div style={{color:T.acc,fontWeight:700,fontSize:13,marginBottom:10}}>📊 Calculadora Automática de Rentabilidad</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
              {[
                {l:'Costo / '+unitLabel(form.unit),v:`$${n(calc.unitCost)}`,c:T.txt},
                {l:'Precio Venta $',v:`$${n(calc.priceUSD)}`,c:T.acc},
                {l:'Precio Venta Bs',v:`Bs ${n(calc.priceUSD*rate)}`,c:T.accl},
                {l:'Ganancia/'+unitLabel(form.unit),v:`$${n(calc.profitPerUnit)}`,c:T.grn},
                {l:'Ganancia Bruta Total',v:`$${n(calc.grossProfit)}`,c:T.grn},
                {l:'ROI',v:`${n(pf(form.margin),1)}%`,c:T.blu},
              ].map(r=>(
                <div key={r.l} style={{padding:'9px 11px',background:T.bg4,borderRadius:8}}>
                  <div style={{color:T.mut,fontSize:10,textTransform:'uppercase',marginBottom:3}}>{r.l}</div>
                  <div style={{color:r.c,fontWeight:700,fontSize:14}}>{r.v}</div>
                </div>
              ))}
            </div>
          </div>
        )}
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button style={S.btnS} onClick={()=>setShowForm(false)}>Cancelar</button>
          <button style={S.btnP} onClick={save}>💾 {editing?'Guardar Cambios':'Agregar al Inventario'}</button>
        </div>
      </Modal>

      <div style={S.card}>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead><tr>
              {['Producto','Cat.','Unidad','Stock','Mín','Costo/u','Precio $','Precio Bs','Margen','G.Bruta','Estado',''].map(h=>(
                <th key={h} style={{padding:'8px 9px',textAlign:'left',color:T.mut,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.06em',borderBottom:`1px solid ${T.brd}`,whiteSpace:'nowrap'}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {filtered.map(p=>{
                const sl=stockLight(p);
                const ul=unitLabel(p.unit);
                return(
                  <tr key={p.id} style={{borderBottom:`1px solid ${T.brd}22`}} onMouseEnter={e=>e.currentTarget.style.background=T.bg3+'66'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    <td style={{padding:'10px 9px',fontWeight:600,maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</td>
                    <td style={{padding:'10px 9px',color:T.dim}}><span style={{...S.bdg(T.pur),fontSize:10}}>{p.category||'—'}</span></td>
                    <td style={{padding:'10px 9px',color:T.dim,fontSize:12}}>{ul}</td>
                    <td style={{padding:'10px 9px',color:sl.color,fontWeight:700}}>{n(p.qty,2)}</td>
                    <td style={{padding:'10px 9px',color:T.mut,fontSize:12}}>{p.minStock}</td>
                    <td style={{padding:'10px 9px'}}>${n(p.unitCost)}</td>
                    <td style={{padding:'10px 9px',color:T.acc,fontWeight:700}}>${n(p.priceUSD)}</td>
                    <td style={{padding:'10px 9px',color:T.dim}}>Bs {n(p.priceUSD*rate)}</td>
                    <td style={{padding:'10px 9px',color:T.grn}}>{n(p.margin,1)}%</td>
                    <td style={{padding:'10px 9px',color:T.grn}}>${n(p.profitPerUnit*p.qty)}</td>
                    <td style={{padding:'10px 9px'}}><span style={S.bdg(sl.color)}>{sl.label}</span></td>
                    <td style={{padding:'10px 9px'}}>
                      <div style={{display:'flex',gap:5}}>
                        <button style={S.btnSm} onClick={()=>openEdit(p)}>✏️</button>
                        <button style={{...S.btnSm,color:T.red,borderColor:T.red+'33'}} onClick={()=>del(p.id)}>🗑️</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {filtered.length===0&&<tr><td colSpan={12} style={{padding:36,textAlign:'center',color:T.mut}}>Sin productos. {products.length===0?'Haz clic en "Cargar Ejemplos" o "+ Nuevo Producto"':'No hay coincidencias con el filtro.'}  </td></tr>}
            </tbody>
          </table>
        </div>
        <div style={{marginTop:10,color:T.dim,fontSize:11,textAlign:'right'}}>Total: {filtered.length} productos · Valor inventario: ${n(filtered.reduce((a,p)=>a+p.unitCost*p.qty,0))}</div>
      </div>
    </div>
  );
}

// POS / FACTURACIÓN
// ════════════════════════════════════════════════════════════
function POSView({currentUser,activeWorker,notify,isOnline}){
  const cfg      = useConfig();
  const products = useCol('productos');
  const settings = cfg?.settings || {};
  const rates    = cfg?.rates    || {bcv:36.50,parallel:38.20,active:'parallel'};
  const rate     = rates.active==='bcv' ? rates.bcv : rates.parallel;
  const methods  = (cfg?.payMethods||DEFAULT_METHODS).filter(m=>m.active!==false);

  const [cart,        setCart]        = useState([]);
  const [search,      setSearch]      = useState('');
  const [catF,        setCatF]        = useState('');
  const [payType,     setPayType]     = useState('contado');
  const [payMethod,   setPayMethod]   = useState(methods[0]?.id||'usd_cash');
  const [discPct,     setDiscPct]     = useState(0);
  const [clientName,  setClientName]  = useState('');
  const [clientPhone, setClientPhone] = useState('');
  const [qtyModal,    setQtyModal]    = useState(null); // product to set custom qty
  const [customQty,   setCustomQty]   = useState('');

  const worker    = activeWorker || currentUser;
  const cats      = [...new Set(products.map(p=>p.category).filter(Boolean))];
  const available = products.filter(p=>(p.qty||0)>0&&(!search||p.name.toLowerCase().includes(search.toLowerCase())||p.category?.toLowerCase().includes(search.toLowerCase()))&&(!catF||p.category===catF));

  const addToCart = (product, qty=1) => {
    const unit = ALL_UNITS.find(u=>u.id===product.unit)||{fractional:false};
    // Si la unidad es fraccionable, preguntar cantidad
    if(unit.fractional) { setQtyModal(product); setCustomQty('1'); return; }
    setCart(prev=>{
      const ex=prev.find(i=>i.id===product.id);
      if(ex){if(ex.qty>=product.qty){notify(`Stock máximo: ${n(product.qty,2)} ${product.unit}`,'error');return prev;}return prev.map(i=>i.id===product.id?{...i,qty:i.qty+pf(qty)}:i);}
      return [...prev,{id:product.id,name:product.name,basePrice:product.priceUSD,qty:pf(qty),unit:product.unit,maxQty:product.qty}];
    });
  };

  const confirmCustomQty = () => {
    if(!qtyModal) return;
    const q = pf(customQty);
    if(q<=0){notify('Cantidad inválida','error');return;}
    if(q>qtyModal.qty){notify(`Stock disponible: ${n(qtyModal.qty,3)} ${qtyModal.unit}`,'error');return;}
    setCart(prev=>{
      const ex=prev.find(i=>i.id===qtyModal.id);
      if(ex) return prev.map(i=>i.id===qtyModal.id?{...i,qty:i.qty+q}:i);
      return [...prev,{id:qtyModal.id,name:qtyModal.name,basePrice:qtyModal.priceUSD,qty:q,unit:qtyModal.unit,maxQty:qtyModal.qty}];
    });
    setQtyModal(null); setCustomQty('');
  };

  const updateQty = (id,delta) => {
    setCart(prev=>{
      const item = prev.find(i=>i.id===id);
      if(!item) return prev;
      const unit = ALL_UNITS.find(u=>u.id===item.unit)||{fractional:false};
      const step = unit.fractional ? 0.25 : 1;
      const newQty = Math.max(0, item.qty + delta*step);
      if(newQty > item.maxQty){notify(`Stock máximo: ${n(item.maxQty,2)}`,'error');return prev;}
      if(newQty === 0) return prev.filter(i=>i.id!==id);
      return prev.map(i=>i.id===id?{...i,qty:newQty}:i);
    });
  };

  const itemPrice = bp => {
    if(payType!=='fiado') return bp;
    return settings.creditMarkupType==='percent' ? bp*(1+pf(settings.creditMarkupPct)/100) : bp+pf(settings.creditMarkupUSD);
  };

  const subtotal = cart.reduce((a,i)=>a+itemPrice(i.basePrice)*i.qty,0);
  const discAmt  = subtotal*pf(discPct)/100;
  const total    = subtotal - discAmt;
  const canDisc  = currentUser?.role==='admin' || settings.allowWorkerDiscount;
  const maxDisc  = currentUser?.role==='admin' ? 100 : pf(settings.maxDiscountPct);

  const completeSale = async () => {
    if(cart.length===0){notify('El carrito está vacío','error');return;}
    if(payType==='fiado'&&!clientName){notify('Ingrese nombre del cliente para fiado','error');return;}
    const profit = cart.reduce((acc,item)=>{
      const prod = products.find(p=>p.id===item.id);
      const cost = prod ? prod.unitCost*item.qty : 0;
      return acc + (itemPrice(item.basePrice)*item.qty) - cost;
    },0) - discAmt;

    const sale = {
      date:new Date().toISOString(), workerId:worker?.id||'', workerName:worker?.name||'',
      items:cart.map(i=>({id:i.id,name:i.name,qty:i.qty,unit:i.unit,unitPrice:itemPrice(i.basePrice),subtotal:itemPrice(i.basePrice)*i.qty})),
      paymentType:payType, paymentMethod:payMethod, discountPct:pf(discPct), discountAmt:discAmt,
      subtotal, total, profit, rate, totalBs:total*rate,
      clientName:payType==='fiado'?clientName:'', clientPhone:payType==='fiado'?clientPhone:'',
      offline:!isOnline, createdAt:new Date().toISOString(),
    };
    if(db){
      const batch = db.batch();
      batch.set(col('ventas').doc(), sale);
      cart.forEach(item=>{
        const prod=products.find(p=>p.id===item.id);
        if(prod) batch.update(docF('productos',item.id),{qty:Math.max(0,prod.qty-item.qty),sold:(prod.sold||0)+item.qty,updatedAt:new Date().toISOString()});
      });
      await batch.commit();
      if(payType==='fiado'){
        const cRef = col('clientes').doc((clientName||'').toLowerCase().replace(/\s+/g,'_')+'_'+uid());
        await cRef.set({name:clientName,phone:clientPhone,totalOwed:total,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
        await cRef.collection('transacciones').add({amount:total,date:sale.date,paid:false,createdAt:new Date().toISOString()});
      }
    }
    setCart([]); setSearch(''); setPayType('contado'); setPayMethod(methods[0]?.id||'usd_cash'); setDiscPct(0); setClientName(''); setClientPhone('');
    notify(isOnline?`✅ Venta completada: $${n(total)} · Bs ${n(total*rate)}`:`⚡ Venta offline: $${n(total)}`);
  };

  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 380px',gap:16,minHeight:'70vh'}}>
      {/* Productos */}
      <div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12,flexWrap:'wrap'}}>
          <h1 style={S.h1}>🧾 Facturación</h1>
          <span style={S.bdg(T.blu)}>Turno: {worker?.name||'Sin asignar'}</span>
          {!isOnline&&<span style={S.bdg(T.yel)}>⚡ Offline</span>}
        </div>
        <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
          <input style={{...S.inp,flex:1,minWidth:160}} placeholder="🔍 Buscar..." value={search} onChange={e=>setSearch(e.target.value)}/>
          <select style={{...S.sel,width:'auto',minWidth:140}} value={catF} onChange={e=>setCatF(e.target.value)}>
            <option value="">Todas</option>
            {cats.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>

        {/* Modal cantidad fraccionada */}
        <Modal show={!!qtyModal} onClose={()=>setQtyModal(null)} title={`¿Cuánto ${qtyModal?.unit||''}?`} maxW={360}>
          <div style={{marginBottom:12}}><div style={{fontWeight:700,fontSize:16,marginBottom:4}}>{qtyModal?.name}</div><div style={{color:T.mut,fontSize:12}}>Precio: ${n(qtyModal?.priceUSD)} / {qtyModal?.unit} · Stock: {n(qtyModal?.qty,3)}</div></div>
          <FRow label={`Cantidad (${qtyModal?.unit})`}>
            <input style={S.inp} type="number" step="0.1" min="0.1" max={qtyModal?.qty} value={customQty} onChange={e=>setCustomQty(e.target.value)} autoFocus onKeyDown={e=>e.key==='Enter'&&confirmCustomQty()}/>
          </FRow>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,marginBottom:14}}>
            {[0.25,0.5,0.75,1,1.5,2,3,5].map(v=>(
              <button key={v} onClick={()=>setCustomQty(String(v))}
                style={{...S.btnSm,textAlign:'center',padding:'8px 4px',color:customQty==v?T.acc:T.dim,borderColor:customQty==v?T.acc:T.brd,background:customQty==v?T.acc+'22':T.bg4}}>
                {v}
              </button>
            ))}
          </div>
          {customQty&&<div style={{color:T.mut,fontSize:12,marginBottom:12}}>Total: <strong style={{color:T.acc}}>${n(pf(customQty)*pf(qtyModal?.priceUSD))}</strong> · Bs {n(pf(customQty)*pf(qtyModal?.priceUSD)*rate)}</div>}
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <button style={S.btnS} onClick={()=>setQtyModal(null)}>Cancelar</button>
            <button style={S.btnP} onClick={confirmCustomQty}>✅ Agregar al Carrito</button>
          </div>
        </Modal>

        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(155px,1fr))',gap:9}}>
          {available.map(p=>{
            const inCart=cart.find(i=>i.id===p.id);
            const sl=stockLight(p);
            const ul=ALL_UNITS.find(u=>u.id===p.unit)?.abbr||p.unit;
            return(
              <div key={p.id} onClick={()=>addToCart(p)}
                style={{...S.card,cursor:'pointer',borderColor:inCart?T.acc:T.brd,padding:12,userSelect:'none',transition:'border-color 0.1s'}}
                onMouseEnter={e=>e.currentTarget.style.background=T.bg2}
                onMouseLeave={e=>e.currentTarget.style.background=T.bg1}>
                <div style={{fontWeight:700,fontSize:12,marginBottom:3,color:inCart?T.acc:T.txt,lineHeight:1.3}}>{p.name}</div>
                <div style={{color:T.mut,fontSize:10,marginBottom:7}}>{p.category}</div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div><div style={{color:T.acc,fontWeight:900,fontSize:15}}>${n(p.priceUSD)}</div><div style={{color:T.dim,fontSize:10}}>/{ul}</div></div>
                  <span style={S.bdg(sl.color)}>{n(p.qty,1)}</span>
                </div>
                <div style={{color:T.dim,fontSize:10,marginTop:3}}>Bs {n(p.priceUSD*rate)}</div>
                {inCart&&<div style={{marginTop:5,color:T.acc,fontSize:10,fontWeight:700}}>✓ ×{n(inCart.qty,2)} {ul}</div>}
              </div>
            );
          })}
          {available.length===0&&<div style={{color:T.mut,padding:20,gridColumn:'1/-1'}}>Sin productos disponibles.</div>}
        </div>
      </div>

      {/* Carrito */}
      <div style={{...S.card,display:'flex',flexDirection:'column',height:'fit-content',position:'sticky',top:56}}>
        <h3 style={{...S.h3,marginBottom:12}}>🛒 Carrito</h3>
        <div style={{maxHeight:230,overflowY:'auto',marginBottom:12}}>
          {cart.length===0
            ? <div style={{color:T.mut,textAlign:'center',padding:'20px 0',fontSize:13}}>Selecciona productos</div>
            : cart.map(item=>{
                const ul=ALL_UNITS.find(u=>u.id===item.unit)||{fractional:false,abbr:'und'};
                const step=ul.fractional?0.25:1;
                return(
                  <div key={item.id} style={{display:'flex',alignItems:'center',gap:7,padding:'8px 0',borderBottom:`1px solid ${T.brd}22`}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,fontSize:11,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                      <div style={{color:T.acc,fontSize:11}}>${n(itemPrice(item.basePrice))} ×{n(item.qty,2)} {ul.abbr} = <strong>${n(itemPrice(item.basePrice)*item.qty)}</strong></div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
                      <button style={{...S.btnSm,padding:'3px 7px'}} onClick={()=>updateQty(item.id,-1)}>−</button>
                      <span style={{fontSize:12,fontWeight:700,minWidth:28,textAlign:'center'}}>{n(item.qty,ul.fractional?2:0)}</span>
                      <button style={{...S.btnSm,padding:'3px 7px'}} onClick={()=>updateQty(item.id,1)}>+</button>
                    </div>
                  </div>
                );
              })
          }
        </div>

        <div style={{marginBottom:9}}>
          <label style={S.lbl}>Tipo de Pago</label>
          <div style={{display:'flex',gap:7}}>
            {[['contado','💵 Contado',T.grn],['fiado','📋 Fiado',T.red]].map(([v,l,c])=>(
              <button key={v} onClick={()=>setPayType(v)}
                style={{flex:1,padding:'8px',borderRadius:8,border:`2px solid ${payType===v?c:T.brd}`,background:payType===v?c+'22':'transparent',color:payType===v?c:T.mut,cursor:'pointer',fontWeight:700,fontFamily:'inherit',fontSize:12}}>
                {l}
              </button>
            ))}
          </div>
          {payType==='fiado'&&<div style={{marginTop:6,padding:'7px 10px',background:T.red+'15',borderRadius:6,fontSize:11,color:T.red}}>⚠️ Recargo: {settings.creditMarkupType==='percent'?`+${settings.creditMarkupPct}%`:`+$${settings.creditMarkupUSD}`}</div>}
        </div>

        {payType==='fiado'&&(
          <div style={{marginBottom:9,display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
            <div><label style={S.lbl}>Cliente *</label><input style={S.inp} placeholder="Nombre" value={clientName} onChange={e=>setClientName(e.target.value)}/></div>
            <div><label style={S.lbl}>Teléfono</label><input style={S.inp} placeholder="0412..." value={clientPhone} onChange={e=>setClientPhone(e.target.value)}/></div>
          </div>
        )}

        <div style={{marginBottom:9}}>
          <label style={S.lbl}>Método de Pago</label>
          <select style={S.sel} value={payMethod} onChange={e=>setPayMethod(e.target.value)}>
            {methods.map(m=><option key={m.id} value={m.id}>{m.label}</option>)}
          </select>
        </div>

        {canDisc&&(
          <div style={{marginBottom:9}}>
            <label style={S.lbl}>Descuento Manual (%) — máx {maxDisc}%</label>
            <input style={S.inp} type="number" min="0" max={maxDisc} step="1" value={discPct} onChange={e=>setDiscPct(Math.min(pf(e.target.value),maxDisc))}/>
          </div>
        )}

        <div style={{background:T.bg3,borderRadius:10,padding:12,marginBottom:11}}>
          {discPct>0&&(
            <>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:T.mut,marginBottom:4}}><span>Subtotal</span><span>${n(subtotal)}</span></div>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:T.red,marginBottom:4}}><span>Descuento {n(discPct,1)}%</span><span>−${n(discAmt)}</span></div>
            </>
          )}
          <div style={{display:'flex',justifyContent:'space-between',color:T.acc,fontWeight:900,fontSize:22,letterSpacing:'-0.5px'}}><span>TOTAL</span><span>${n(total)}</span></div>
          <div style={{textAlign:'right',color:T.dim,fontSize:12,marginTop:2}}>Bs {n(total*rate)}</div>
        </div>
        <button style={{...S.btnP,width:'100%',padding:'13px',fontSize:15}} onClick={completeSale}>
          {isOnline?'✅ Completar Venta':'⚡ Guardar Offline'}
        </button>
      </div>
    </div>
  );
}

// CUENTAS POR COBRAR
// ════════════════════════════════════════════════════════════
function ReceivablesView({notify}){
  const cfg     = useConfig();
  const rate    = (cfg?.rates?.active==='bcv'?cfg?.rates?.bcv:cfg?.rates?.parallel)||36;
  const [clients, setClients] = useState([]);
  const [sel,     setSel]     = useState(null);
  const [txns,    setTxns]    = useState([]);
  const [payAmt,  setPayAmt]  = useState('');

  useEffect(()=>{ if(!db)return; const u=col('clientes').orderBy('createdAt','asc').onSnapshot(s=>setClients(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{}); return u; },[]);
  useEffect(()=>{
    if(!db||!sel){setTxns([]);return;}
    const u=col('clientes').doc(sel).collection('transacciones').orderBy('createdAt','asc').onSnapshot(s=>setTxns(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{});
    return u;
  },[sel]);

  const client    = sel?clients.find(c=>c.id===sel):null;
  const totalOwed = clients.reduce((a,c)=>a+pf(c.totalOwed||0),0);

  const markPaid = async txId => {
    const amt=pf(payAmt); if(!amt){notify('Ingrese monto','error');return;}
    await col('clientes').doc(sel).collection('transacciones').doc(txId).update({paid:true,paidDate:new Date().toISOString(),paidAmt:amt});
    const remaining=txns.filter(t=>!t.paid&&t.id!==txId).reduce((a,t)=>a+t.amount,0);
    await col('clientes').doc(sel).update({totalOwed:remaining,updatedAt:new Date().toISOString()});
    setPayAmt(''); notify('✅ Pago registrado ☁️');
  };

  return (
    <div style={{display:'grid',gridTemplateColumns:sel?'1fr 1fr':'1fr',gap:18}}>
      <div>
        <h1 style={{...S.h1,marginBottom:16}}>💳 Cuentas por Cobrar</h1>
        <div style={{...S.card,marginBottom:14,borderTop:`3px solid ${T.red}`,display:'flex',gap:20,flexWrap:'wrap'}}>
          <div><div style={{color:T.mut,fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.07em'}}>Total Adeudado</div><div style={{color:T.red,fontSize:28,fontWeight:900}}>${n(totalOwed)}</div><div style={{color:T.dim,fontSize:12}}>Bs {n(totalOwed*rate)}</div></div>
          <div><div style={{color:T.mut,fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.07em'}}>Clientes con Deuda</div><div style={{color:T.yel,fontSize:28,fontWeight:900}}>{clients.filter(c=>c.totalOwed>0).length}</div><div style={{color:T.dim,fontSize:12}}>de {clients.length} clientes</div></div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          {clients.map(c=>(
            <div key={c.id} onClick={()=>setSel(sel===c.id?null:c.id)}
              style={{...S.card,cursor:'pointer',borderColor:sel===c.id?T.acc:T.brd,transition:'border-color 0.15s'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div><div style={{fontWeight:700}}>{c.name}</div><div style={{color:T.mut,fontSize:12}}>{c.phone||'Sin teléfono'}</div></div>
                <div style={{textAlign:'right'}}><div style={{color:c.totalOwed>0?T.red:T.grn,fontWeight:800,fontSize:16}}>${n(c.totalOwed||0)}</div><div style={{color:T.dim,fontSize:11}}>Bs {n((c.totalOwed||0)*rate)}</div></div>
              </div>
            </div>
          ))}
          {clients.length===0&&<div style={{...S.card,color:T.mut,textAlign:'center',padding:28}}>🎉 No hay cuentas pendientes.</div>}
        </div>
      </div>
      {client&&(
        <div style={S.card}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:14}}><h2 style={S.h2}>{client.name}</h2><button style={S.btnSm} onClick={()=>setSel(null)}>✕</button></div>
          {client.phone&&<div style={{color:T.mut,fontSize:13,marginBottom:12}}>📱 {client.phone}</div>}
          <div style={{display:'flex',flexDirection:'column',gap:9}}>
            {txns.map(t=>(
              <div key={t.id} style={{padding:'11px',background:T.bg3,borderRadius:9,borderLeft:`3px solid ${t.paid?T.grn:T.red}`}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:t.paid?0:9}}>
                  <div><div style={{fontWeight:600,fontSize:13}}>{fmtDt(t.date)}</div><span style={S.bdg(t.paid?T.grn:T.red)}>{t.paid?'✅ PAGADO':'❌ PENDIENTE'}</span>{t.paid&&<div style={{color:T.dim,fontSize:11,marginTop:3}}>Recibido: ${n(t.paidAmt)} · {fmtDt(t.paidDate)}</div>}</div>
                  <div style={{textAlign:'right'}}><div style={{fontWeight:800,color:T.acc,fontSize:15}}>${n(t.amount)}</div><div style={{color:T.dim,fontSize:11}}>Bs {n(t.amount*rate)}</div></div>
                </div>
                {!t.paid&&(
                  <div style={{display:'flex',gap:7,alignItems:'center'}}>
                    <input style={{...S.inp,flex:1}} type="number" step="0.01" placeholder="Monto recibido ($)" value={payAmt} onChange={e=>setPayAmt(e.target.value)}/>
                    <button style={S.btnOk} onClick={()=>markPaid(t.id)}>Registrar</button>
                  </div>
                )}
              </div>
            ))}
            {txns.length===0&&<div style={{color:T.mut,textAlign:'center',padding:18}}>Sin transacciones.</div>}
          </div>
        </div>
      )}
    </div>
  );
}

// REPORTES
// ════════════════════════════════════════════════════════════
function ReportsView(){
  const cfg   = useConfig();
  const sales = useCol('ventas','date');
  const rate  = (cfg?.rates?.active==='bcv'?cfg?.rates?.bcv:cfg?.rates?.parallel)||36;
  const methods=(cfg?.payMethods||DEFAULT_METHODS);

  const [filter,setFilter]   = useState('today');
  const [from,  setFrom]     = useState(todayStr());
  const [to,    setTo]       = useState(todayStr());
  const today      = todayStr();
  const monthStart = today.slice(0,7)+'-01';

  const filtered = sales.filter(s=>{
    const d=s.date?.slice(0,10);
    if(filter==='today')  return d===today;
    if(filter==='month')  return d>=monthStart;
    if(filter==='custom') return d>=from&&d<=to;
    return true;
  });

  const totalRev    = filtered.reduce((a,s)=>a+pf(s.total),0);
  const totalProfit = filtered.reduce((a,s)=>a+pf(s.profit),0);
  const creditTotal = filtered.filter(s=>s.paymentType==='fiado').reduce((a,s)=>a+pf(s.total),0);
  const byMethod    = {};
  filtered.forEach(s=>{ byMethod[s.paymentMethod]=(byMethod[s.paymentMethod]||0)+pf(s.total); });

  const mLabel = id => methods.find(m=>m.id===id)?.label || id;

  const exportCSV = () => {
    const hdr=['Fecha','Trabajador','Tipo','Método','Subtotal $','Desc. $','Total $','Total Bs','Ganancia $','Cliente','Offline'];
    const rows=filtered.map(s=>[fmtDt(s.date),s.workerName,s.paymentType,mLabel(s.paymentMethod),n(s.subtotal),n(s.discountAmt),n(s.total),n(s.totalBs),n(s.profit),s.clientName||'',s.offline?'SÍ':'NO']);
    const csv=[hdr,...rows].map(r=>r.join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv'}));a.download=`ventas_${today}.csv`;a.click();
  };

  const exportShts = async () => {
    const hdr=['Fecha','Trabajador','Tipo','Método','Total $','Total Bs','Ganancia $','Cliente'];
    const rows=filtered.map(s=>[fmtDt(s.date),s.workerName,s.paymentType,mLabel(s.paymentMethod),n(s.total),n(s.totalBs),n(s.profit),s.clientName||'']);
    const ok=await exportToSheets([hdr,...rows],'Ventas');
    if(ok) alert('✅ Exportado a Google Sheets');
    else exportCSV();
  };

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18,flexWrap:'wrap',gap:10}}>
        <h1 style={S.h1}>📈 Reportes de Ventas</h1>
        <div style={{display:'flex',gap:8}}>
          <button style={{...S.btnSm,color:T.cyn,borderColor:T.cyn+'44'}} onClick={exportShts}>📊 Google Sheets</button>
          <button style={S.btnP} onClick={exportCSV}>📥 Exportar CSV</button>
        </div>
      </div>

      <div style={{...S.card,marginBottom:16,display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
        {[['today','Hoy'],['month','Este Mes'],['all','Todas'],['custom','Rango']].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} style={{background:filter===v?T.acc:T.bg3,color:filter===v?'#000':T.dim,border:`1px solid ${filter===v?T.acc:T.brd}`,borderRadius:8,padding:'7px 14px',fontWeight:700,cursor:'pointer',fontSize:13,fontFamily:'inherit'}}>{l}</button>
        ))}
        {filter==='custom'&&(
          <div style={{display:'flex',gap:7,alignItems:'center'}}>
            <input style={{...S.inp,width:130}} type="date" value={from} onChange={e=>setFrom(e.target.value)}/>
            <span style={{color:T.mut}}>→</span>
            <input style={{...S.inp,width:130}} type="date" value={to} onChange={e=>setTo(e.target.value)}/>
          </div>
        )}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:12,marginBottom:16}}>
        <KpiCard label="Ingresos" value={`$${n(totalRev)}`} sub={`Bs ${n(totalRev*rate)}`} color={T.acc} icon="💰"/>
        <KpiCard label="Ganancia Neta" value={`$${n(totalProfit)}`} sub={`${n(totalRev>0?totalProfit/totalRev*100:0,1)}% margen`} color={T.grn} icon="📈"/>
        <KpiCard label="Ventas Fiado" value={`$${n(creditTotal)}`} sub={`${filtered.filter(s=>s.paymentType==='fiado').length} operaciones`} color={T.red} icon="📋"/>
        <KpiCard label="Transacciones" value={filtered.length} sub={`${filtered.filter(s=>s.discountAmt>0).length} con descuento`} color={T.blu} icon="🧾"/>
      </div>

      <div style={{...S.card,marginBottom:16}}>
        <h3 style={{...S.h3,marginBottom:12}}>💳 Por Método de Pago</h3>
        <div style={{display:'flex',flexWrap:'wrap',gap:9}}>
          {Object.entries(byMethod).map(([mid,tot])=>(
            <div key={mid} style={{padding:'9px 14px',background:T.bg3,borderRadius:9}}>
              <div style={{color:T.mut,fontSize:10,textTransform:'uppercase',marginBottom:2}}>{mLabel(mid)}</div>
              <div style={{color:T.acc,fontWeight:800,fontSize:16}}>${n(tot)}</div>
              <div style={{color:T.dim,fontSize:11}}>Bs {n(tot*rate)}</div>
            </div>
          ))}
          {!Object.keys(byMethod).length&&<div style={{color:T.mut,fontSize:13}}>Sin ventas.</div>}
        </div>
      </div>

      <div style={S.card}>
        <h3 style={{...S.h3,marginBottom:12}}>📋 Historial Detallado</h3>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead><tr>{['Fecha','Turno','Tipo','Método','Desc.','Total $','Total Bs','Ganancia','Cliente',''].map(h=>(
              <th key={h} style={{padding:'8px 9px',textAlign:'left',color:T.mut,fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'0.06em',borderBottom:`1px solid ${T.brd}`,whiteSpace:'nowrap'}}>{h}</th>
            ))}</tr></thead>
            <tbody>
              {filtered.slice().reverse().map((s,i)=>(
                <tr key={s.id||i} style={{borderBottom:`1px solid ${T.brd}22`}}>
                  <td style={{padding:'9px',color:T.dim,whiteSpace:'nowrap',fontSize:12}}>{fmtDt(s.date)}</td>
                  <td style={{padding:'9px',fontSize:12}}>{s.workerName}</td>
                  <td style={{padding:'9px'}}><span style={S.bdg(s.paymentType==='fiado'?T.red:T.grn)}>{s.paymentType}</span></td>
                  <td style={{padding:'9px',color:T.dim,fontSize:12}}>{mLabel(s.paymentMethod)}</td>
                  <td style={{padding:'9px',color:s.discountPct>0?T.yel:T.mut,fontSize:12}}>{s.discountPct>0?`${n(s.discountPct,1)}%`:'—'}</td>
                  <td style={{padding:'9px',color:T.acc,fontWeight:700}}>${n(s.total)}</td>
                  <td style={{padding:'9px',color:T.dim}}>Bs {n(s.totalBs)}</td>
                  <td style={{padding:'9px',color:T.grn}}>${n(s.profit)}</td>
                  <td style={{padding:'9px',color:T.dim,fontSize:12}}>{s.clientName||'—'}</td>
                  <td style={{padding:'9px'}}>{s.offline&&<span style={S.bdg(T.yel)}>⚡</span>}</td>
                </tr>
              ))}
              {!filtered.length&&<tr><td colSpan={10} style={{padding:28,textAlign:'center',color:T.mut}}>Sin ventas en el período.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── TAB MÉTODOS DE PAGO (editables) ──────────────────────
function TabPayments({cfg,notify}){
  const methods   = cfg?.payMethods || DEFAULT_METHODS;
  const [methods2,setMethods2]=useState(methods);
  const [newLabel,setNewLabel]=useState('');
  useEffect(()=>setMethods2(cfg?.payMethods||DEFAULT_METHODS),[cfg?.payMethods?.length]);

  const toggle = idx => { const m=[...methods2]; m[idx]={...m[idx],active:!m[idx].active}; setMethods2(m); };
  const editLabel=(idx,v)=>{ const m=[...methods2]; m[idx]={...m[idx],label:v}; setMethods2(m); };
  const del = idx => { if(!confirm('¿Eliminar este método?'))return; setMethods2(methods2.filter((_,i)=>i!==idx)); };
  const addNew = () => {
    if(!newLabel.trim()){notify('Escriba un nombre','error');return;}
    setMethods2([...methods2,{id:'custom_'+uid(),label:newLabel.trim(),active:true}]);
    setNewLabel('');
  };
  const save=()=>{updCfg({payMethods:methods2});notify('Métodos de pago guardados ☁️');};

  return (
    <div style={S.card}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h3 style={S.h3}>💳 Métodos de Pago</h3>
        <button style={S.btnP} onClick={save}>💾 Guardar Todo ☁️</button>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:9,marginBottom:16}}>
        {methods2.map((m,i)=>(
          <div key={m.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:T.bg3,borderRadius:9}}>
            <input type="checkbox" checked={m.active!==false} onChange={()=>toggle(i)} style={{accentColor:T.acc,width:16,height:16,cursor:'pointer'}}/>
            <input style={{...S.inp,flex:1}} value={m.label} onChange={e=>editLabel(i,e.target.value)}/>
            <span style={S.bdg(m.active!==false?T.grn:T.mut)}>{m.active!==false?'Activo':'Inactivo'}</span>

// ── TAB PUNTO DE EQUILIBRIO COMPLETO ─────────────────────
function TabBreakEven({cfg,notify}){
  const products = useCol('productos');
  const sales    = useCol('ventas','date');
  const rates    = cfg?.rates||{bcv:36.50,parallel:38.20,active:'parallel'};
  const rate     = rates.active==='bcv'?rates.bcv:rates.parallel;
  const [expenses, setExpenses] = useState(cfg?.expenses||DEFAULT_EXPENSES);
  const [extraExp, setExtraExp] = useState([]);

  useEffect(()=>{ if(cfg?.expenses) setExpenses(cfg.expenses); },[cfg?.expenses?.length]);

  const setAmt = (id,val) => setExpenses(prev=>prev.map(e=>e.id===id?{...e,amount:pf(val)}:e));
  const setExtraAmt=(i,val)=>setExtraExp(prev=>prev.map((e,idx)=>idx===i?{...e,amount:pf(val)}:e));
  const setExtraLbl=(i,val)=>setExtraExp(prev=>prev.map((e,idx)=>idx===i?{...e,label:val}:e));
  const addExtra=()=>setExtraExp(prev=>[...prev,{id:'extra_'+uid(),label:'Otro Gasto',amount:0}]);
  const delExtra=i=>setExtraExp(prev=>prev.filter((_,idx)=>idx!==i));
  const saveAll=()=>{updCfg({expenses:[...expenses,...extraExp]});notify('Gastos operativos guardados ☁️');};

  const allExp = [...expenses,...extraExp];
  const totalOpEx = allExp.reduce((a,e)=>a+pf(e.amount),0);

  // Margen promedio de inventario
  const avgMargin  = products.length ? products.reduce((a,p)=>a+pf(p.margin),0)/products.length : 30;
  // Ingresos necesarios para cubrir gastos
  const breakEvenUSD  = avgMargin>0 ? totalOpEx/(avgMargin/100) : 0;
  // Proyecciones
  const dailyTarget   = breakEvenUSD/30;
  const weeklyTarget  = breakEvenUSD/4.33;
  const monthlyTarget = breakEvenUSD;

  // Ventas reales del mes actual
  const monthStart = todayStr().slice(0,7)+'-01';
  const monthlySales = sales.filter(s=>s.date?.slice(0,10)>=monthStart);
  const monthlyActual = monthlySales.reduce((a,s)=>a+pf(s.total),0);
  const todaySales = sales.filter(s=>s.date?.startsWith(todayStr()));
  const todayActual = todaySales.reduce((a,s)=>a+pf(s.total),0);

  const progressPct = monthlyTarget>0?Math.min(100,monthlyActual/monthlyTarget*100):0;

  return (
    <div>
      <h3 style={{...S.h3,marginBottom:16}}>📉 Punto de Equilibrio y Gastos Operativos</h3>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:16}}>
        {/* Gastos */}
        <div style={{...S.card,gridColumn:'span 1'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
            <h3 style={S.h3}>💸 Gastos Operativos Mensuales ($)</h3>
            <button style={{...S.btnSm,color:T.grn,borderColor:T.grn+'44'}} onClick={addExtra}>+ Agregar</button>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:12,maxHeight:400,overflowY:'auto'}}>
            {expenses.map(e=>(
              <div key={e.id} style={{display:'grid',gridTemplateColumns:'1fr auto',gap:8,alignItems:'center'}}>
                <div><div style={{color:T.dim,fontSize:11,marginBottom:3}}>{e.label}</div>
                  <input style={S.inp} type="number" step="0.5" min="0" placeholder="0.00" value={e.amount||''} onChange={ev=>setAmt(e.id,ev.target.value)}/></div>
                <div style={{color:e.amount>0?T.acc:T.mut,fontWeight:700,fontSize:13,minWidth:60,textAlign:'right',paddingTop:14}}>${n(e.amount)}</div>
              </div>
            ))}
            {extraExp.map((e,i)=>(
              <div key={e.id} style={{display:'grid',gridTemplateColumns:'1fr 80px auto',gap:7,alignItems:'end'}}>
                <FRow label="Nombre">
                  <input style={S.inp} placeholder="Ej: Seguro" value={e.label} onChange={ev=>setExtraLbl(i,ev.target.value)}/>
                </FRow>
                <FRow label="Monto $">
                  <input style={S.inp} type="number" step="0.5" min="0" value={e.amount||''} onChange={ev=>setExtraAmt(i,ev.target.value)}/>
                </FRow>
                <button style={{...S.btnSm,color:T.red,borderColor:T.red+'33',marginBottom:0}} onClick={()=>delExtra(i)}>🗑️</button>
              </div>
            ))}
          </div>
          <button style={{...S.btnP,width:'100%'}} onClick={saveAll}>💾 Guardar Gastos ☁️</button>
        </div>

        {/* Panel resultados */}
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          {/* Resumen gastos */}
          <div style={{...S.card,borderTop:`3px solid ${T.red}`}}>
            <div style={{color:T.mut,fontSize:10,fontWeight:700,textTransform:'uppercase',marginBottom:6}}>Total Gastos Operativos / Mes</div>
            <div style={{color:T.red,fontSize:32,fontWeight:900,letterSpacing:'-1px'}}>${n(totalOpEx)}</div>
            <div style={{color:T.dim,fontSize:13}}>Bs {n(totalOpEx*rate)}</div>
            <div style={{color:T.mut,fontSize:11,marginTop:6}}>Margen promedio inventario: {n(avgMargin,1)}%</div>
          </div>

          {/* Proyecciones */}
          <div style={{...S.card}}>
            <div style={{color:T.mut,fontSize:10,fontWeight:700,textTransform:'uppercase',marginBottom:12}}>📊 Debe Vender Para Cubrir Gastos</div>
            {[
              {l:'📅 Promedio Diario',  usd:dailyTarget,   bs:dailyTarget*rate},
              {l:'📆 Promedio Semanal', usd:weeklyTarget,  bs:weeklyTarget*rate},
              {l:'🗓️ Total Mensual',    usd:monthlyTarget, bs:monthlyTarget*rate},
            ].map(r=>(
              <div key={r.l} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 12px',background:T.bg3,borderRadius:8,marginBottom:8}}>
                <div style={{fontSize:13,fontWeight:600}}>{r.l}</div>
                <div style={{textAlign:'right'}}>
                  <div style={{color:T.acc,fontWeight:800,fontSize:16}}>${n(r.usd)}</div>
                  <div style={{color:T.dim,fontSize:11}}>Bs {n(r.bs)}</div>
                </div>
              </div>
            ))}
          </div>

          {/* Progreso mes */}
          <div style={{...S.card}}>
            <div style={{color:T.mut,fontSize:10,fontWeight:700,textTransform:'uppercase',marginBottom:10}}>📈 Progreso del Mes Actual</div>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
              <span style={{fontSize:12,color:T.dim}}>Ventas del mes: <strong style={{color:T.acc}}>${n(monthlyActual)}</strong></span>
              <span style={{fontSize:12,color:T.dim}}>Meta: <strong style={{color:T.txt}}>${n(monthlyTarget)}</strong></span>
            </div>
            <div style={{height:10,background:T.bg4,borderRadius:6,overflow:'hidden',marginBottom:8}}>
              <div style={{height:'100%',width:progressPct+'%',background:progressPct>=100?T.grn:progressPct>60?T.yel:T.red,borderRadius:6,transition:'width 0.5s'}}/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:T.dim}}>
              <span>{n(progressPct,1)}% completado</span>
              <span style={{color:progressPct>=100?T.grn:T.red}}>{progressPct>=100?'✅ Meta alcanzada':'Faltan $'+n(monthlyTarget-monthlyActual)}</span>
            </div>
            <div style={{marginTop:10,padding:'9px',background:T.bg3,borderRadius:8}}>
              <div style={{color:T.mut,fontSize:10,textTransform:'uppercase',marginBottom:4}}>Ventas de Hoy</div>
              <div style={{color:T.acc,fontSize:20,fontWeight:800}}>${n(todayActual)}<span style={{color:T.dim,fontSize:12,fontWeight:400,marginLeft:8}}>Bs {n(todayActual*rate)}</span></div>
              <div style={{color:dailyTarget>0&&todayActual>=dailyTarget?T.grn:T.yel,fontSize:11,marginTop:3}}>
                {dailyTarget>0&&todayActual>=dailyTarget?'✅ Meta diaria alcanzada':`Meta diaria: $${n(dailyTarget)}`}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── TAB USUARIOS ──────────────────────────────────────────
function TabUsers({users,currentUser,notify}){
  const [showForm,setShowForm]=useState(false);
  const [editUser,setEditUser]=useState(null);
  const [uForm,setUForm]=useState({name:'',email:'',password:'',role:'worker'});
  const uf=(k,v)=>setUForm(p=>({...p,[k]:v}));

  const openNew  = () => { setEditUser(null); setUForm({name:'',email:'',password:'',role:'worker'}); setShowForm(true); };
  const openEdit = u  => { setEditUser(u); setUForm({name:u.name,email:u.email,password:u.password,role:u.role}); setShowForm(true); };

  const saveUser = async () => {
    if(!uForm.name||!uForm.email||!uForm.password){notify('Complete todos los campos','error');return;}
    if(users.find(u=>u.email.toLowerCase()===uForm.email.toLowerCase()&&u.id!==editUser?.id)){notify('Email ya registrado','error');return;}
    const data={name:uForm.name,email:uForm.email,password:uForm.password,role:uForm.role,active:true,updatedAt:new Date().toISOString()};
    if(db){
      if(editUser){ await docF('usuarios',editUser.id).update(data); notify('Usuario actualizado ☁️'); }
      else { await col('usuarios').add({...data,createdAt:new Date().toISOString()}); notify('Usuario creado ☁️'); }
    }
    setShowForm(false);
  };

  const delUser = async u => {
    if(u.id===currentUser.id){notify('No puedes eliminarte a ti mismo','error');return;}
    if(u.role==='admin'&&users.filter(x=>x.role==='admin'&&x.active!==false).length<=1){notify('Necesitas al menos 1 admin','error');return;}
    if(!confirm(`¿Eliminar a ${u.name}?`))return;
    if(db) await docF('usuarios',u.id).delete();
    notify('Usuario eliminado');
  };

  const toggleActive = async u => {
    if(u.id===currentUser.id){notify('No puedes desactivarte','error');return;}
    if(u.role==='admin'&&u.active!==false&&users.filter(x=>x.role==='admin'&&x.active!==false).length<=1){notify('Necesitas al menos 1 admin activo','error');return;}
    if(db) await docF('usuarios',u.id).update({active:!(u.active!==false),updatedAt:new Date().toISOString()});
  };

  return (
    <div>
      <Modal show={showForm} onClose={()=>setShowForm(false)} title={editUser?'✏️ Editar Usuario':'➕ Nuevo Usuario'} maxW={480}>
        <FRow label="Nombre Completo"><input style={S.inp} placeholder="Ej: María Torres" value={uForm.name} onChange={e=>uf('name',e.target.value)}/></FRow>
        <FRow label="Correo Electrónico"><input style={S.inp} type="email" placeholder="maria@empresa.com" value={uForm.email} onChange={e=>uf('email',e.target.value)}/></FRow>
        <FRow label="Contraseña"><input style={S.inp} placeholder="Mínimo 4 caracteres" value={uForm.password} onChange={e=>uf('password',e.target.value)}/></FRow>
        <FRow label="Rol">
          <select style={S.sel} value={uForm.role} onChange={e=>uf('role',e.target.value)}>
            <option value="worker">👤 Trabajador — Facturación e inventario</option>
            <option value="admin">🔑 Administrador — Acceso total</option>
          </select>
        </FRow>
        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:16}}>
          <button style={S.btnS} onClick={()=>setShowForm(false)}>Cancelar</button>
          <button style={S.btnP} onClick={saveUser}>💾 {editUser?'Guardar':'Crear Usuario'}</button>
        </div>
      </Modal>

      <div style={{...S.card}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <h3 style={S.h3}>👥 Gestión de Usuarios y Turnos</h3>
          <button style={S.btnP} onClick={openNew}>+ Nuevo Usuario</button>
        </div>
        {users.length===0&&<div style={{color:T.mut,textAlign:'center',padding:'18px 0',fontSize:13}}>No hay usuarios registrados en la nube. Crea el primero arriba.</div>}
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          {users.map(u=>(
            <div key={u.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'13px 15px',background:T.bg3,borderRadius:10,border:`1px solid ${T.brd}`,flexWrap:'wrap',gap:9}}>
              <div style={{flex:1,minWidth:180}}>
                <div style={{fontWeight:700,fontSize:14,display:'flex',alignItems:'center',gap:7}}>
                  {u.name} {u.id===currentUser.id&&<span style={S.bdg(T.pur)}>Tú</span>}
                </div>
                <div style={{color:T.mut,fontSize:12,marginTop:3,display:'flex',gap:10,flexWrap:'wrap'}}>
                  <span>📧 {u.email}</span>
                  <span style={{color:u.role==='admin'?T.acc:T.blu}}>{u.role==='admin'?'🔑 Admin':'👤 Trabajador'}</span>
                </div>
              </div>
              <div style={{display:'flex',gap:7,flexShrink:0}}>
                <button onClick={()=>toggleActive(u)} style={{...S.btnSm,color:u.active!==false?T.grn:T.red,borderColor:(u.active!==false?T.grn:T.red)+'44'}}>{u.active!==false?'✓ Activo':'✗ Inactivo'}</button>
                <button onClick={()=>openEdit(u)} style={{...S.btnSm,color:T.blu,borderColor:T.blu+'44'}}>✏️ Editar</button>
                {u.id!==currentUser.id&&<button onClick={()=>delUser(u)} style={{...S.btnSm,color:T.red,borderColor:T.red+'33'}}>🗑️ Eliminar</button>}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── TAB EXPORTAR ──────────────────────────────────────────
function TabExport({cfg,notify}){
  const products = useCol('productos');
  const sales    = useCol('ventas','date');
  const users    = useCol('usuarios');

  const exportJSON=()=>{
    const data={negocioId:NEGOCIO_ID,exportDate:new Date().toISOString(),config:cfg,productos:products,ventas:sales,usuarios:users.map(u=>({...u,password:'[redacted]'}))};
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`backup_pos_${todayStr()}.json`;a.click();
    notify('📥 Backup completo descargado');
  };

  const exportProdCSV=()=>{
    const rate=(cfg?.rates?.active==='bcv'?cfg?.rates?.bcv:cfg?.rates?.parallel)||36;
    const hdr=['Producto','Categoría','Unidad','Stock','Costo Unit.$','Precio $','Precio Bs','Margen%','Ganancia Bruta$','Stock Mín'];
    const rows=products.map(p=>[p.name,p.category,p.unit,n(p.qty,2),n(p.unitCost),n(p.priceUSD),n(p.priceUSD*rate),n(p.margin,1),n(p.profitPerUnit*p.qty),p.minStock]);
    const csv=[hdr,...rows].map(r=>r.join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv'}));a.download=`inventario_${todayStr()}.csv`;a.click();
    notify('📥 Inventario CSV descargado');
  };

  const exportSalesCSV=()=>{
    const hdr=['Fecha','Trabajador','Tipo','Método','Subtotal $','Desc.$','Total $','Total Bs','Ganancia $','Cliente'];
    const rows=sales.map(s=>[fmtDt(s.date),s.workerName,s.paymentType,s.paymentMethod,n(s.subtotal),n(s.discountAmt),n(s.total),n(s.totalBs),n(s.profit),s.clientName||'']);
    const csv=[hdr,...rows].map(r=>r.join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv'}));a.download=`ventas_${todayStr()}.csv`;a.click();
    notify('📥 Ventas CSV descargado');
  };

  const exportToSheetsNow=async(type)=>{
    let rows,sheet;
    if(type==='products'){const rate=(cfg?.rates?.active==='bcv'?cfg?.rates?.bcv:cfg?.rates?.parallel)||36;rows=products.map(p=>[p.name,p.category,p.unit,n(p.qty,2),n(p.unitCost),n(p.priceUSD),n(p.priceUSD*rate),n(p.margin,1)]);sheet='Inventario';}
    else{rows=sales.map(s=>[fmtDt(s.date),s.workerName,s.paymentType,n(s.total),n(s.totalBs),n(s.profit),s.clientName||'']);sheet='Ventas';}
    const ok=await exportToSheets(rows,sheet);
    if(ok) notify(`✅ ${sheet} exportado a Google Sheets`);
    else notify('⚠️ Configura SHEETS_WEBHOOK para exportar a Sheets','error');
  };

  return (
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(290px,1fr))',gap:16}}>
      {[
        {title:'📦 Inventario',desc:'Exportar todos los productos con precios, costos y márgenes.',actions:[{l:'📊 → Google Sheets',fn:()=>exportToSheetsNow('products'),c:T.grn},{l:'📥 Descargar CSV',fn:exportProdCSV,c:T.blu}]},
        {title:'🧾 Ventas',desc:'Exportar historial completo de ventas.',actions:[{l:'📊 → Google Sheets',fn:()=>exportToSheetsNow('sales'),c:T.grn},{l:'📥 Descargar CSV',fn:exportSalesCSV,c:T.blu}]},
        {title:'💾 Backup Completo',desc:'Exportar TODA la base de datos en JSON (config, productos, ventas, usuarios).',actions:[{l:'💾 Descargar JSON',fn:exportJSON,c:T.acc}]},
      ].map(sec=>(
        <div key={sec.title} style={S.card}>
          <h3 style={{...S.h3,marginBottom:8}}>{sec.title}</h3>
          <p style={{color:T.dim,fontSize:13,marginBottom:14}}>{sec.desc}</p>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {sec.actions.map(a=>(
              <button key={a.l} onClick={a.fn} style={{...S.btnP,background:a.c,color:a.c===T.acc?'#000':'#fff',textAlign:'left',padding:'10px 14px'}}>{a.l}</button>
            ))}
          </div>
        </div>
      ))}
      <div style={S.card}>
        <h3 style={{...S.h3,marginBottom:8}}>☁️ Google Sheets (Webhook)</h3>
        <p style={{color:T.dim,fontSize:13,marginBottom:12}}>Para exportación automática a Sheets, configura el webhook en <code style={{color:T.acc}}>index.html</code>:<br/><code style={{color:T.yel,fontSize:11}}>const SHEETS_WEBHOOK = "URL_DE_TU_SCRIPT"</code></p>
        <div style={{padding:'10px',background:T.bg3,borderRadius:8,fontSize:11,color:T.dim}}>Ver INSTRUCCIONES.md → Sección "Google Sheets Apps Script"</div>
      </div>
    </div>
  );
}
